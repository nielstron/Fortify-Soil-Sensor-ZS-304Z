# Package-style example. Rename raw source entities to match your custom device.
# Establish dry/wet points in your own soil; no ZG-303Z constants are reused.
input_number:
  arteco_soil_dry_ratio:
    name: Arteco dry reference ratio
    min: 0
    max: 10
    step: 0.0001
    mode: box
  arteco_soil_wet_ratio:
    name: Arteco wet reference ratio
    min: 0
    max: 10
    step: 0.0001
    mode: box

template:
  - sensor:
      - name: Arteco soil ADC ratio
        unique_id: fortify_arteco_soil_adc_ratio
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.arteco_soil_raw_adc'))
             and is_number(states('sensor.arteco_soil_adc_reference'))
             and states('sensor.arteco_soil_adc_reference') | float(0) > 0 }}
        state: >-
          {{ (states('sensor.arteco_soil_raw_adc') | float /
              states('sensor.arteco_soil_adc_reference') | float) | round(5) }}
      - name: Arteco soil moisture calibrated
        unique_id: fortify_arteco_soil_calibrated
        device_class: moisture
        state_class: measurement
        unit_of_measurement: '%'
        availability: >-
          {{ is_number(states('sensor.arteco_soil_adc_ratio'))
             and is_number(states('input_number.arteco_soil_dry_ratio'))
             and is_number(states('input_number.arteco_soil_wet_ratio'))
             and states('input_number.arteco_soil_dry_ratio') | float(0)
                 != states('input_number.arteco_soil_wet_ratio') | float(0) }}
        state: >-
          {% set ratio = states('sensor.arteco_soil_adc_ratio') | float %}
          {% set dry = states('input_number.arteco_soil_dry_ratio') | float %}
          {% set wet = states('input_number.arteco_soil_wet_ratio') | float %}
          {{ [[100 * (ratio - dry) / (wet - dry), 0] | max, 100] | min | round(1) }}
